# Local development: `docker compose up --build`
#   web: http://localhost:5173
#   api: http://localhost:3000

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published on the host, so it doesn't clash with a local Postgres on 5432.
    # Use `docker compose exec db psql -U postgres` to connect.

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
      args:
        UID: ${USER_ID:-1000}
        GID: ${GROUP_ID:-1000}
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
    ports:
      - "3000:3000"
    volumes:
      - ./api:/rails
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      # The browser calls the API, so it uses the port published on the host.
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  db-data:
  bundle:
  web-node-modules:
